<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sig Chi Name Game — 2023 PC</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <main class="app">
    <header class="hero">
      <div>
        <div class="title-line">
          <h1>Sig Chi Name Game — 2023 PC</h1>
          <span class="crest-chip" aria-hidden="true">ΣΧ</span>
        </div>
        <nav class="year-nav" aria-label="Select pledge class">
          <a class="chip" href="index.html">2025</a>
          <a class="chip" href="24pc.html">2024</a>
          <a class="chip active" aria-current="page" href="23pc.html">2023</a>
          <a class="chip" href="freshmen.html">Freshman PC</a>
        </nav>
        <div class="mode-buttons" role="group" aria-label="Game modes">
          <button class="chip active" data-mode="mix">Mix</button>
          <button class="chip" data-mode="major">Guess Major</button>
          <button class="chip" data-mode="home">Guess Hometown and Graduation Year</button>
          <button class="chip" data-mode="middle">Guess Middle</button>
          <button class="chip" data-mode="last">Guess Last</button>
          <button class="chip" data-mode="photo">Photo Guess</button>
          <button class="chip" data-mode="greek">Greek Alphabet</button>
          <button class="chip" data-mode="flash">Flashcards</button>
        </div>
      </div>
      <div class="stat-block">
        <div><span>Accuracy</span><strong id="stat-accuracy">—</strong></div>
        <div><span>Streak</span><strong id="stat-streak">0 🔥</strong></div>
        <div><span>Rounds</span><strong id="stat-rounds">0</strong></div>
      </div>
      <div class="toggles">
        <button id="btn-theme" class="ghost small">Toggle Light</button>
      </div>
    </header>

    <section class="game">
      <div class="card" id="card">
        <div class="card-top">
          <p class="tag" id="ask-label">Guess the major</p>
          <p class="name" id="name"></p>
          <p class="aka" id="aka"></p>
        </div>
        <div class="photo-wrap" id="photo-wrap">
          <img id="photo" alt="Pledge photo">
        </div>
        <div class="clue" id="clue"></div>
        <div class="prompt" id="prompt"></div>
        <div class="options" id="options"></div>
        <div class="reveal" id="reveal"></div>
        <div class="actions">
          <button id="btn-reveal" class="primary">Reveal</button>
          <button id="btn-next" class="ghost">Next ↻</button>
          <button id="btn-flip" class="ghost small">Flip Flash Side</button>
          <button id="btn-hint" class="ghost small">Hint</button>
          <div class="manual-score" id="manual-score">
            <button data-mark="got">I knew it ✅</button>
            <button data-mark="miss">Missed 🙃</button>
          </div>
        </div>

      <section class="dash">
        <div class="dash-card">
          <p class="label">Per-Mode Accuracy</p>
          <div class="mode-accuracy" id="mode-accuracy"></div>
        </div>
        <div class="dash-card">
          <p class="label">Hardest Names (needs work)</p>
          <div class="hardest" id="hardest"></div>
        </div>
      </section>

      </div>

      <aside class="sidebar">
        <div class="mini-search">
          <input id="filter" type="search" placeholder="Search pledges..." autocomplete="off">
        </div>
        <div class="list" id="quicklist"></div>
      </aside>
    </section>
  </main>

  <script src="data-23pc.js"></script>
  <script src="script.js"></script>
</body>
</html>
