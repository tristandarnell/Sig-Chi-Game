<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pledge Memory Arcade</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-gradient"></div>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Sigma Chi • Spring Pledges</p>
        <h1>Pledge Memory Arcade</h1>
        <div class="mode-buttons" role="group" aria-label="Game modes">
          <button class="chip active" data-mode="mix">Mix</button>
          <button class="chip" data-mode="major">Guess Major</button>
          <button class="chip" data-mode="home">Guess Hometown</button>
          <button class="chip" data-mode="middle">Guess Middle</button>
          <button class="chip" data-mode="last">Guess Last</button>
          <button class="chip" data-mode="flash">Flashcards</button>
        </div>
      </div>
      <div class="stat-block">
        <div><span>Accuracy</span><strong id="stat-accuracy">—</strong></div>
        <div><span>Streak</span><strong id="stat-streak">0 🔥</strong></div>
        <div><span>Rounds</span><strong id="stat-rounds">0</strong></div>
      </div>
    </header>

    <section class="game">
      <div class="card" id="card">
        <div class="card-top">
          <p class="tag" id="ask-label">Guess the major</p>
          <p class="name" id="name"></p>
          <p class="aka" id="aka"></p>
        </div>
        <div class="clue" id="clue"></div>
        <div class="prompt" id="prompt"></div>
        <div class="options" id="options"></div>
        <div class="reveal" id="reveal"></div>
        <div class="actions">
          <button id="btn-reveal" class="primary">Reveal</button>
          <button id="btn-next" class="ghost">Next ↻</button>
          <button id="btn-flip" class="ghost small">Flip Flash Side</button>
          <div class="manual-score" id="manual-score">
            <button data-mark="got">I knew it ✅</button>
            <button data-mark="miss">Missed 🙃</button>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="mini-search">
          <input id="filter" type="search" placeholder="Search pledges..." autocomplete="off">
        </div>
        <div class="list" id="quicklist"></div>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
